services:
  # IB Gateway Service - Handles connection to Interactive Brokers
  ajj-ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ajj-ib-gateway
    env_file:
#      - ../.env.local
      - ../.env.jf.dev
    environment:
      # IB Account Credentials
      - TWS_USERID=${IB_USERNAME}
      - TWS_PASSWORD=${IB_PASSWORD}

      # Trading Mode: 'paper' or 'live'
      - TRADING_MODE=${TRADING_MODE:-paper}

      # VNC Password (optional - for remote desktop access to Gateway UI)
#      - VNC_SERVER_PASSWORD=${VNC_PASSWORD:-vncpassword}
      - IBC_HEADLESS=true

      # API Configuration
      #READ_ONLY_API: "no"
      - READ_ONLY_API=no

      # Auto-restart configuration (Gateway restarts daily around 11:45 PM ET)
      - RELOGIN_AFTER_TWOFA_TIMEOUT=yes
      - TWOFA_TIMEOUT_ACTION=restart

    # -------------------------------------------------------------------------
    # PORTS -- read before "fixing" these numbers. They are correct.
    #
    # The gnzsnz/ib-gateway image runs IB Gateway bound to CONTAINER-localhost
    # on 4001 (live) / 4002 (paper). Those are NOT reachable from outside the
    # container. The image runs socat to relay:
    #
    #     container 4003  ->  gateway 4001  (live)
    #     container 4004  ->  gateway 4002  (paper)
    #
    # So anything connecting from outside must use the socat ports (4003/4004).
    # The mapping below is HOST:CONTAINER, which is why host 4002 maps to
    # container 4004 -- host-side we keep the conventional "4002 = paper"
    # numbering, container-side we must hit socat.
    #
    #   trader container -> ajj-ib-gateway:4004   (over trading-network)
    #   your Mac         -> 127.0.0.1:4002
    # -------------------------------------------------------------------------
    ports:
      - "127.0.0.1:4002:4004"  # Paper trading API (host 4002 -> socat paper)

      # Live trading API (host 4001 -> socat live). Left commented while this
      # setup is paper-only: with TRADING_MODE=paper nothing is behind it, but
      # it becomes a LIVE API endpoint the moment TRADING_MODE flips.
      # - "127.0.0.1:4001:4003"

      # VNC Port (optional - for debugging/viewing Gateway UI)
      # Access via VNC client at localhost:5900 or browser at localhost:6080
      - "127.0.0.1:5900:5900"  # VNC Server
      - "127.0.0.1:6080:6080"  # noVNC (browser-based VNC)

    restart: unless-stopped
    networks:
      - trading-network

    # Health check to ensure Gateway is responding
    healthcheck:
      # Two things this must NOT do:
      #   1. Use `nc` -- it is not installed in the gnzsnz image, so the check
      #      errors out and the container is permanently "unhealthy".
      #   2. Probe 4004 -- that is socat, which listens from container start
      #      whether or not IB Gateway is up, so it reports healthy while the
      #      Gateway is still on the login screen.
      # Probe the Gateway's own port instead, with bash, which is present.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/4002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Options Trading Service - Your Python trading application
  ajj-options-trader:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    #container_name: ajj-options-trading-service
    container_name: ajj-options-trader
    env_file:
#      - ../.env.local
      - ../.env.jf.dev
    stdin_open: true  # Enable interactive CLI
    tty: true

    # Wait for IB Gateway to be ready before starting
    depends_on:
      ajj-ib-gateway:
        #condition: service_healthy
        condition: service_started

    volumes:
      # Mount config directory for easy editing
      - ../config:/app/config
      # Mount logs directory for persistence
      - ../logs:/app/logs
      # Mount data directory for CSV exports
      - ../data:/app/data
      - ../:/app

    environment:
      # IB Connection Settings (override config.yaml)
      - IB_HOST=ajj-ib-gateway  # Docker service name
      - IB_PORT=${IB_PORT:-4004}  # socat paper port inside the gateway container
      - PAPER_TRADING=${PAPER_TRADING:-true}

      # Where price bars come from. Separate from TRADING_MODE/PAPER_TRADING on
      # purpose: those pick the ACCOUNT, this picks the DATA SOURCE.
      # realtime | delayed | replay   (see example.env). Defaults to the safe
      # one: replay never places an order.
      - DATA_MODE=${DATA_MODE:-replay}

      # Optional: Logging level
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    networks:
      - trading-network

    restart: unless-stopped

networks:
  trading-network:
    driver: bridge
    name: trading-network
