[project]
name = "trading-engine"
version = "0.1.0"
description = "Local ORB + Gamma Exposure trading engine for Interactive Brokers"
requires-python = ">=3.13"
dependencies = [
    "ib_async==2.1.0",
    "nest_asyncio==1.6.0",
    "PyYAML==6.0.1",
    "pydantic==2.10.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "pytest-asyncio==0.25.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
