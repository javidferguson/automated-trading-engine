# =============================================================================
# ORB + Gamma Exposure Engine Configuration
# =============================================================================
# Strategy: 30-minute opening range -> clean-body 5-min breakout -> GEX strike
# confirmation -> 0DTE option bracket order (human-confirmed).
#
# Ported from the Bot_ORB_Gamma implementation (branch jf/test-ca-code),
# translated from raw ibapi to ib_async.

# -----------------------------------------------------------------------------
# IB API Connection
# -----------------------------------------------------------------------------
# See example.env for why the port is 4004 and not 4002: the gnzsnz/ib-gateway
# image binds the Gateway to container-localhost on 4001/4002 and relays via
# socat on 4003 (live) / 4004 (paper). We connect from the trader container over
# the docker network, so we must use the socat port.
connection:
  host: 'ajj-ib-gateway'   # docker service name ('127.0.0.1' for a local Gateway)
  port: 4004               # socat paper. Live would be 4003 -- don't.
  client_id: 2             # distinct from the options scanner's client_id: 1

# -----------------------------------------------------------------------------
# Account
# -----------------------------------------------------------------------------
account:
  type: "paper"            # Enforced at runtime by assert_paper_account():
                           # every managed account must start with DU/DF.

# -----------------------------------------------------------------------------
# Instrument
# -----------------------------------------------------------------------------
instrument:
  ticker: "SPY"
  sec_type: "STK"          # "IND" for cash indices such as SPX
  exchange: "SMART"        # "CBOE" for SPX
  currency: "USD"

# -----------------------------------------------------------------------------
# Stage 1: Opening Range
# -----------------------------------------------------------------------------
opening_range:
  market_open_time: "09:30:00"   # expressed in exchange_timezone below
  duration_minutes: 30
  bar_size: "1 min"
  # Must match the exchange, AND the Gateway's TIME_ZONE (docker-compose).
  # If the Gateway runs on Etc/UTC, IB returns 09:30 ET bars stamped 13:30 and
  # the opening range silently matches nothing.
  exchange_timezone: "America/New_York"

# -----------------------------------------------------------------------------
# Stage 2: Breakout Detection
# -----------------------------------------------------------------------------
breakout:
  bar_size_seconds: 300    # aggregate 5-second bars into 5-minute candles

# -----------------------------------------------------------------------------
# Data source (DATA_MODE env var overrides this)
# -----------------------------------------------------------------------------
# realtime | delayed | replay -- see example.env. Kept here only as a fallback
# default; the env var is the intended control surface.
data:
  # Which of the sections below applies. DATA_MODE in the environment (or
  # --data-mode on the command line) overrides this; `make orb-delayed` and
  # `make orb-replay` set it for you, so you do not need to edit this line to
  # switch modes.
  #
  #   replay    a past session re-fed as if live. No subscription, no market
  #             hours, NEVER places an order. The correctness gate.
  #   delayed   live data ~15 min behind. No subscription. Observation only:
  #             a 0DTE breakout cannot be traded on a 15-minute lag.
  #   realtime  live 5-second bars. REQUIRES a paid IB market data
  #             subscription. The only mode that can trade a breakout.
  mode: "replay"

  # Both sections are always read; `mode` decides which one is used. There is
  # no need to comment either out.

  replay:
    date: "2026-08-27"      # YYYY-MM-DD, a past RTH session
    bar_size: "30 secs"     # historical bar size fed through the aggregator
    speed: 0                # seconds to sleep between bars (0 = as fast as possible)
    #
    # Setting `date` to TODAY is worth knowing about: the opening range and
    # breakout replay from today's real bars, AND the 0DTE expiration is one IB
    # still offers, so the GEX scan is genuinely point-in-time. That is the
    # closest thing to a full end-to-end rehearsal without placing an order.
    #
    # For any EARLIER date the GEX stage cannot be faithful: IB removes expired
    # contracts from the chain, so the session's own expiration is unavailable.
    # The engine warns loudly, falls forward to the nearest live expiration and
    # marks the result point_in_time=false. Stages 1 and 2 stay faithful either
    # way -- it is only the option positioning that reflects today rather than
    # the replayed session.

  delayed:
    bar_size: "30 secs"     # bar size polled from IB
    lookback: "1800 S"      # how far back each poll requests
    poll_seconds: 30        # seconds between polls


# -----------------------------------------------------------------------------
# Stage 3: Gamma Exposure (GEX)
# -----------------------------------------------------------------------------
gex:
  days_to_expiration: 0    # 0DTE
  strikes_quantity: 40     # centred on ATM. The original default of 120 is a lot
                           # of concurrent subscriptions; IB throttles above ~100.
  option_multiplier: 100
  data_timeout_seconds: 30 # total wait for the whole concurrent batch

# -----------------------------------------------------------------------------
# Stage 4: Trade Execution
# -----------------------------------------------------------------------------
trade_execution:
  quantity: 1                    # contracts per trade
  max_quantity: 5                # hard cap; refuses anything larger
  take_profit_percentage: 0.20   # +20% on the option premium
  stop_loss_percentage: 0.15     # -30% on the option premium
  require_confirmation: true     # ALWAYS true on this path. Enforced in code.
